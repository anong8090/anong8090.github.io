  <text x="85" y="315" fill="#93c5fd" font-size="13">•  提示历史消费/痛点/切入点</text>

  <!-- 箭头 1 -->
  <path d="M 330 230 L 360 230" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="360,224 372,230 360,236" fill="#38bdf8"/>

  <!-- 卡片 2: 2. 接待中 (实时听词弹框) -->
  <rect x="380" y="95" width="270" height="275" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="2"/>
  <rect x="395" y="115" width="240" height="40" rx="8" fill="#7c3aed"/>
  <text x="515" y="141" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">2. 接待中 (实时听词弹框)</text>

  <text x="415" y="195" fill="#e2e8f0" font-size="13">•  工牌双麦流式音频切片</text>
  <text x="415" y="235" fill="#e2e8f0" font-size="13">•  云端听词与知识库匹配</text>
  <text x="415" y="275" fill="#ffffff" font-size="13" font-weight="bold">•  屏幕底部静默浮现化解话术</text>
  <text x="415" y="315" fill="#ddd6fe" font-size="13">•  面对面交流时不打扰客户</text>

  <!-- 箭头 2 -->
  <path d="M 660 230 L 690 230" stroke="#a78bfa" stroke-width="3"/>
  <polygon points="690,224 702,230 690,236" fill="#a78bfa"/>

  <!-- 卡片 3: 3. 接待后 (自动总结待办) -->
  <rect x="710" y="95" width="240" height="275" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
  <rect x="725" y="115" width="210" height="40" rx="8" fill="#059669"/>
  <text x="830" y="141" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">3. 接待后 (自动总结待办)</text>

