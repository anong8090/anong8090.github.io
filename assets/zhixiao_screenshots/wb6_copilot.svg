<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="980" height="400" rx="16" fill="url(#bgGrad6)" stroke="#334155" stroke-width="2" filter="url(#shadow6)"/>

  <!-- 顶部主标题 -->
  <text x="500" y="55" fill="#38bdf8" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Copilot 全流程辅助交互逻辑 (前、中、后三阶段闭环)</text>

  <!-- 卡片 1: 1. 接待前 (激活拉取) -->
  <rect x="50" y="95" width="270" height="275" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
  <rect x="65" y="115" width="240" height="40" rx="8" fill="#2563eb"/>
  <text x="185" y="141" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">1. 接待前 (激活与拉取)</text>

  <text x="85" y="195" fill="#e2e8f0" font-size="13">•  前台分诊挂号/扫码触发</text>
  <text x="85" y="235" fill="#e2e8f0" font-size="13">•  自动拉取客户 360 档案</text>
